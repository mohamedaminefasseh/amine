<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Révision Dev Web - QCM Complet</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #27ae60;
            --error: #c0392b;
            --light: #ecf0f1;
            --text: #333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            color: var(--text);
            background-color: #f4f6f7;
        }

        /* Sidebar */
        aside {
            width: 250px;
            background-color: var(--primary);
            color: white;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        aside h2 {
            font-size: 1.2rem;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
        }

        .category-btn {
            background: none;
            border: none;
            color: #bdc3c7;
            text-align: left;
            padding: 12px;
            cursor: pointer;
            font-size: 1rem;
            border-radius: 5px;
            transition: 0.3s;
            margin-bottom: 5px;
            width: 100%;
        }

        .category-btn:hover, .category-btn.active {
            background-color: var(--accent);
            color: white;
            font-weight: bold;
        }

        /* Main Content */
        main {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-y: auto;
        }

        .quiz-container {
            background: white;
            width: 100%;
            max-width: 800px;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .header-quiz {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .badge {
            background: var(--accent);
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        h3.question-text {
            font-size: 1.3rem;
            margin-bottom: 25px;
            line-height: 1.5;
            min-height: 60px;
        }

        /* Options */
        .options-grid {
            display: grid;
            gap: 15px;
        }

        .option-btn {
            background: var(--light);
            border: 2px solid transparent;
            padding: 15px;
            text-align: left;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            position: relative;
        }

        .option-btn:hover:not(:disabled) {
            background: #dfe6e9;
            border-color: #bdc3c7;
        }

        /* States */
        .option-btn.correct {
            background-color: #d4edda;
            border-color: var(--success);
            color: var(--success);
        }

        .option-btn.incorrect {
            background-color: #f8d7da;
            border-color: var(--error);
            color: var(--error);
        }

        /* Footer / Navigation */
        .quiz-footer {
            margin-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .quiz-footer.visible {
            opacity: 1;
            pointer-events: all;
        }

        .explanation {
            font-style: italic;
            color: #555;
            background: #f9f9f9;
            padding: 15px;
            border-left: 4px solid var(--accent);
            flex: 1;
            margin-right: 20px;
            border-radius: 4px;
        }

        .next-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            white-space: nowrap;
        }

        .next-btn:hover {
            background-color: #34495e;
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            aside { width: 100%; height: auto; flex-direction: row; overflow-x: auto; padding: 10px; box-sizing: border-box; }
            aside h2 { display: none; }
            .category-btn { margin-right: 10px; white-space: nowrap; width: auto; padding: 8px 15px; }
            main { padding: 15px; }
            .quiz-footer { flex-direction: column; align-items: stretch; }
            .explanation { margin-right: 0; margin-bottom: 15px; }
            .next-btn { width: 100%; }
        }
    </style>
</head>
<body>

    <aside>
        <h2>Thématiques</h2>

            </div>

                </div>

                <div class="explanation" id="explanation-text"></div>
                <button class="next-btn" onclick="nextQuestion()">Question Suivante →</button>
            </div>
        </div>
    </main>

        // --- ETAT DE L'APPLICATION ---
        let currentCategory = "";
        let filteredQuestions = [];
        let currentIndex = 0;
        let score = 0;
        let answeredCount = 0;

        // --- INITIALISATION ---
        function init() {
            renderCategories();
            // Sélectionner la première catégorie par défaut si disponible
            const categories = [...new Set(allQuestions.map(q => q.category))];
            if (categories.length > 0) {
                filterQuestions(categories[0]);
            }
        }

        // 1. Gérer les catégories (Menu de gauche)
        function renderCategories() {
            const categories = [...new Set(allQuestions.map(q => q.category))];
            const container = document.getElementById('category-list');
            
            container.innerHTML = "";
            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'category-btn';
                if (cat === currentCategory) btn.classList.add('active');
                
                // Compter les questions pour cette catégorie
                const count = allQuestions.filter(q => q.category === cat).length;
                btn.innerHTML = `${cat} <small style="float:right; opacity:0.7">(${count})</small>`;
                
                btn.onclick = () => {
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    filterQuestions(cat);
                };
                container.appendChild(btn);
            });
        }

        // 2. Filtrer les questions et Reset
        function filterQuestions(category) {
            currentCategory = category;
            document.getElementById('current-category').innerText = category;
            
            // Mélanger les questions
            filteredQuestions = allQuestions.filter(q => q.category === category)
                                            .sort(() => Math.random() - 0.5);
            
            currentIndex = 0;
            score = 0;
            answeredCount = 0;
            
            // Mettre à jour la classe active dans le menu
            const allBtns = document.querySelectorAll('.category-btn');
            allBtns.forEach(btn => {
                if(btn.innerText.includes(category)) btn.classList.add('active');
                else btn.classList.remove('active');
            });

            loadQuestion();
        }

        // 3. Charger une question à l'écran
        function loadQuestion() {
            // Reset UI
            document.getElementById('quiz-footer').classList.remove('visible');
            const container = document.getElementById('options-container');
            container.innerHTML = "";
            document.getElementById('explanation-text').innerHTML = "";

            if (currentIndex >= filteredQuestions.length) {
                showResults();
                return;
            }

            const q = filteredQuestions[currentIndex];
            document.getElementById('question-text').innerText = `${currentIndex + 1}. ${q.question}`;
            document.getElementById('score-display').innerText = `Score: ${score} / ${answeredCount}`;

            // Créer les boutons d'options
            for (const [key, value] of Object.entries(q.options)) {
                if(value) { 
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerHTML = `<strong>${key.toUpperCase()}.</strong> ${value}`;
                    btn.onclick = () => checkAnswer(key, q.correct, q.explanation, btn);
                    container.appendChild(btn);
                }
            }
        }

        // 4. Vérifier la réponse
        function checkAnswer(selectedKey, correctKey, explanation, btnElement) {
            // Désactiver tous les boutons
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(btn => btn.disabled = true);

            answeredCount++;

            if (selectedKey === correctKey) {
                score++;
                btnElement.classList.add('correct');
            } else {
                btnElement.classList.add('incorrect');
                // Surligner la bonne réponse
                allBtns.forEach(btn => {
                    if (btn.innerText.startsWith(correctKey.toUpperCase() + '.')) {
                        btn.classList.add('correct');
                    }
                });
            }

            // Mettre à jour le score
            document.getElementById('score-display').innerText = `Score: ${score} / ${answeredCount}`;

            // Afficher l'explication
            const footer = document.getElementById('quiz-footer');
            const expText = document.getElementById('explanation-text');
            
            expText.innerHTML = explanation ? `💡 <strong>Note :</strong> ${explanation}` : "";
            footer.classList.add('visible');
        }

        // 5. Question suivante
        function nextQuestion() {
            currentIndex++;
            loadQuestion();
        }

        // 6. Fin de la catégorie
        function showResults() {
            document.getElementById('question-text').innerText = `Catégorie "${currentCategory}" terminée ! 🎉`;
            document.getElementById('options-container').innerHTML = `
                <div style="text-align:center; font-size: 1.2rem; padding: 20px;">
                    <p>Votre score final :</p>
                    <h1 style="font-size: 3rem; color: var(--primary); margin: 10px 0;">${score} / ${filteredQuestions.length}</h1>
                    <p>${score > (filteredQuestions.length / 2) ? 'Bien joué ! 💪' : 'Continuez à réviser ! 📚'}</p>
                    <button class="next-btn" style="margin-top:20px;" onclick="filterQuestions('${currentCategory}')">Recommencer cette catégorie</button>
                </div>
            `;
            document.getElementById('quiz-footer').classList.remove('visible');
            document.getElementById('score-display').innerText = "";
        }

        // Lancer l'app
        init();
    </script>
</body>
</html>
