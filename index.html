<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QCM Web Dev - 100 Questions Uniques</title>
    <style>
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --success: #27ae60;
            --error: #e74c3c;
            --bg: #f8f9fa;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            background-color: var(--bg);
            color: #333;
        }

        /* Sidebar */
        aside {
            width: 260px;
            background: var(--primary);
            color: white;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
            flex-shrink: 0;
        }

        aside h2 {
            border-bottom: 2px solid var(--accent);
            padding-bottom: 10px;
            margin-bottom: 20px;
            font-size: 1.3rem;
            text-align: center;
        }

        .category-btn {
            background: rgba(255,255,255,0.05);
            border: none;
            color: #bdc3c7;
            text-align: left;
            padding: 12px 15px;
            cursor: pointer;
            border-radius: 6px;
            margin-bottom: 8px;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
        }

        .category-btn:hover, .category-btn.active {
            background: var(--accent);
            color: white;
            font-weight: bold;
        }

        /* Main */
        main {
            flex: 1;
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            overflow-y: auto;
        }

        .quiz-card {
            background: white;
            width: 100%;
            max-width: 800px;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }

        .header-quiz {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        .badge {
            background: var(--accent);
            color: white;
            padding: 5px 12px;
            border-radius: 15px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        h3 {
            min-height: 50px;
            color: #2c3e50;
            font-size: 1.25rem;
        }

        .options-grid {
            display: grid;
            gap: 12px;
        }

        .option-btn {
            background: #fff;
            border: 2px solid #e9ecef;
            padding: 15px;
            border-radius: 8px;
            text-align: left;
            cursor: pointer;
            font-size: 1rem;
            transition: 0.2s;
            color: #495057;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--accent);
            background: #f1f8ff;
        }

        .option-btn.correct {
            background-color: #d1e7dd !important;
            border-color: var(--success) !important;
            color: #0f5132 !important;
        }

        .option-btn.incorrect {
            background-color: #f8d7da !important;
            border-color: var(--error) !important;
            color: #842029 !important;
        }

        /* Footer */
        .quiz-footer {
            margin-top: 25px;
            display: none;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--accent);
        }

        .quiz-footer.visible { display: block; }

        .next-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            float: right;
            margin-top: 10px;
        }

        .next-btn:hover { background: #34495e; }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            aside { width: 100%; height: auto; flex-direction: row; overflow-x: auto; padding: 10px; }
            aside h2 { display: none; }
            .category-btn { margin-right: 10px; white-space: nowrap; padding: 8px 12px; }
            main { padding: 15px; }
        }
    </style>
</head>
<body>

<aside>
    <h2>⚡ Révision Web</h2>
    <div id="category-list"></div>
</aside>

    <div class="quiz-card">
        <div class="header-quiz">
            <span class="badge" id="category-badge">...</span>
            <span style="font-weight:bold; color:var(--primary)" id="score-box">Score: 0</span>
        </div>

        <h3 id="question-text">Chargement...</h3>
        <div class="options-grid" id="options-container"></div>

        <div class="quiz-footer" id="footer">
            <p id="explanation" style="margin: 0 0 10px 0; color: #555;"></p>
            <button class="next-btn" onclick="nextQuestion()">Suivant ➜</button>
            <div style="clear:both"></div>
        </div>
    </div>
</main>

        { category: "Web General", question: "Quelle balise charge un fichier JS ?", options: {a: "<script>", b: "<js>", c: "<link>"}, correct: "a", explanation: "" },
        { category: "Web General", question: "Input type pour un mot de passe ?", options: {a: "text", b: "secure", c: "password"}, correct: "c", explanation: "Masque les caractères." },
        { category: "Web General", question: "Quel attribut rend un champ de formulaire obligatoire ?", options: {a: "mandatory", b: "required", c: "need"}, correct: "b", explanation: "" },
        { category: "Web General", question: "Quelle balise structure un article indépendant ?", options: {a: "<div>", b: "<article>", c: "<section>"}, correct: "b", explanation: "Sémantique." },
        { category: "Web General", question: "Doctype sert à :", options: {a: "Lier le CSS", b: "Indiquer la version HTML au navigateur", c: "Rien"}, correct: "b", explanation: "<!DOCTYPE html> pour HTML5." },
        { category: "Web General", question: "La balise <nav> sert à :", options: {a: "Naviguer sur internet", b: "Définir les liens de navigation du site", c: "Afficher une carte"}, correct: "b", explanation: "" }
    ];

    // ==========================================================
    // LOGIQUE
    // ==========================================================
    let currentCategory = "";
    let filteredQuestions = [];
    let currentIndex = 0;
    let score = 0;

    function init() {
        const categories = [...new Set(allQuestions.map(q => q.category))];
        const btnContainer = document.getElementById('category-list');
        
        categories.forEach(cat => {
            const count = allQuestions.filter(q => q.category === cat).length;
            const btn = document.createElement('button');
            btn.className = 'category-btn';
            btn.innerHTML = `<span>${cat}</span> <b>${count}</b>`;
            btn.onclick = () => loadCategory(cat);
            btnContainer.appendChild(btn);
        });

        // Charger la première catégorie
        loadCategory(categories[0]);
    }

    function loadCategory(cat) {
        currentCategory = cat;
        // Reset
        filteredQuestions = allQuestions.filter(q => q.category === cat);
        currentIndex = 0;
        score = 0;
        
        // UI Updates
        document.getElementById('category-badge').innerText = cat;
        document.getElementById('score-box').innerText = "Score: 0";
        document.querySelectorAll('.category-btn').forEach(b => {
            b.classList.remove('active');
            if(b.innerHTML.includes(cat)) b.classList.add('active');
        });

        showQuestion();
    }

    function showQuestion() {
        const footer = document.getElementById('footer');
        footer.classList.remove('visible');
        
        if(currentIndex >= filteredQuestions.length) {
            finishQuiz();
            return;
        }

        const q = filteredQuestions[currentIndex];
        document.getElementById('question-text').innerText = `${currentIndex + 1}. ${q.question}`;
        
        const container = document.getElementById('options-container');
        container.innerHTML = "";

        // Génération des boutons
        for (const [key, value] of Object.entries(q.options)) {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = value;
            btn.onclick = () => checkAnswer(key, q, btn);
            container.appendChild(btn);
        }
    }

    function checkAnswer(selectedKey, questionObj, btn) {
        // Bloquer tous les boutons
        document.querySelectorAll('.option-btn').forEach(b => b.disabled = true);

        const isCorrect = selectedKey === questionObj.correct;
        if(isCorrect) {
            btn.classList.add('correct');
            score++;
        } else {
            btn.classList.add('incorrect');
            // Trouver et colorer la bonne réponse
            const buttons = document.querySelectorAll('.option-btn');
            // Astuce simple : on retrouve le bouton par son texte
            const correctText = questionObj.options[questionObj.correct];
            buttons.forEach(b => {
                if(b.innerText === correctText) b.classList.add('correct');
            });
        }

        document.getElementById('score-box').innerText = `Score: ${score}`;
        
        // Afficher explication
        const footer = document.getElementById('footer');
        const exp = document.getElementById('explanation');
        exp.innerHTML = isCorrect ? "✅ <b>Bonne réponse !</b>" : "❌ <b>Mauvaise réponse.</b>";
        if(questionObj.explanation) {
            exp.innerHTML += `<br><small>${questionObj.explanation}</small>`;
        }
        footer.classList.add('visible');
    }

    function nextQuestion() {
        currentIndex++;
        showQuestion();
    }

    function finishQuiz() {
        document.getElementById('question-text').innerText = "Terminé ! 🎉";
        document.getElementById('options-container').innerHTML = `
            <div style="text-align:center; padding:20px;">
                <h2>Score final : ${score} / ${filteredQuestions.length}</h2>
                <button class="next-btn" style="float:none" onclick="loadCategory('${currentCategory}')">Recommencer</button>
            </div>
        `;
        document.getElementById('footer').classList.remove('visible');
    }

    // Lancer
    init();

</script>
</body>
</html>
